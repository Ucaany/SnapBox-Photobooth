[package]
name = "snapbox-desktop"
version = "0.1.0"
description = "SnapBox Photobooth Kiosk"
authors = ["SnapBox"]
edition = "2021"
rust-version = "1.77"
license = "UNLICENSED"
publish = false

# Binary kiosk memuat library agar integrasi test dan binary tambahan
# (service auto-start Windows, Fase 4) bisa memakai kode yang sama.
[lib]
name = "snapbox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
tauri-plugin-opener = "2.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
# Ukuran installer jadi pertimbangan: kiosk di-distribusi lewat GitHub Releases.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
