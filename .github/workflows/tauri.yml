# Workflow build installer desktop Tauri (SnapBox Kiosk).
# Hanya dipicu manual (workflow_dispatch) atau tag versi 'v*', tidak pernah tiap PR.
# Matriks membangun installer Windows NSIS dan Ubuntu deb.
# Artifact selalu diunggah; untuk tag versi job release melampirkan artifact ke GitHub Release.
# Signing/notarization/auto-update metadata DI LUAR SCOPE di sini, itu Task 8.3.
# Installer yang dihasilkan adalah draft tanpa tanda tangan.

name: Tauri

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref rilis (branch/tag/SHA) yang dibangun. Tag v* memicu job release; selain itu hanya artefak.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: nsis
            artifact: nsis
            path_glob: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-latest
            target: deb
            artifact: deb
            path_glob: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
    env:
      CI: 'true'
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      SENTRY_RELEASE: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build Tauri bundle
        working-directory: apps/desktop
        run: pnpm tauri:build -- --bundles ${{ matrix.target }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapbox-kiosk-${{ matrix.artifact }}
          path: ${{ matrix.path_glob }}
          if-no-files-found: error
          retention-days: 14

  # Signing, notarization, dan metadata auto-update sengaja tidak ada di sini.
  # Semua itu masuk Task 8.3. Job release ini hanya draft tanpa tanda tangan.
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R dist-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**/*
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Installer pada release ini adalah draft TANPA tanda tangan (unsigned).
            Signing dan notarization belum dilakukan, itu bagian dari Task 8.3.
